<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src * data: crx:; style-src 'self' 'unsafe-inline'"
    />
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="toolbox.css" />
  </head>
  <body>
    <div id="panel">
      <div class="pair">
        <button class="tile" id="fullscreen">
          <svg viewBox="0 0 16 16"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10" /></svg>
          <span></span>
        </button>
        <button class="tile" id="translate">
          <svg viewBox="0 0 16 16"><path d="M2 3.5h6M5 2v1.5M3 3.5c.4 2.2 1.9 3.9 4 4.8M7 3.5C6.5 6 5 7.6 2.5 8.6M8.5 14l2.5-6.5 2.5 6.5M9.3 12h3.4" /></svg>
          <span></span>
        </button>
      </div>

      <h2 id="device-title"></h2>
      <div class="segments" id="devices">
        <button data-device="desktop">
          <svg viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="8.5" rx="1.5" /><path d="M5.5 13.5h5M8 11v2.5" /></svg>
          <span></span>
        </button>
        <button data-device="tablet">
          <svg viewBox="0 0 16 16"><rect x="3" y="1.5" width="10" height="13" rx="1.8" /><path d="M7 12.2h2" /></svg>
          <span></span>
        </button>
        <button data-device="mobile">
          <svg viewBox="0 0 16 16"><rect x="4.5" y="1.5" width="7" height="13" rx="1.8" /><path d="M7.3 12.2h1.4" /></svg>
          <span></span>
        </button>
      </div>

      <h2 id="zoom-title"></h2>
      <div class="zoom">
        <button id="zoom-out"><svg viewBox="0 0 16 16"><path d="M3.5 8h9" /></svg></button>
        <button id="zoom-reset"></button>
        <button id="zoom-in"><svg viewBox="0 0 16 16"><path d="M8 3.5v9M3.5 8h9" /></svg></button>
      </div>

      <div id="extensions">
        <h2 id="extensions-title"></h2>
        <browser-action-list id="actions" alignment="bottom right"></browser-action-list>
        <button class="link" id="store"></button>
      </div>
    </div>
    <script src="strings.js"></script>
    <script src="toolbox.js"></script>
  </body>
</html>
