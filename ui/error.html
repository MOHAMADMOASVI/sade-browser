<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
    <title>Can’t open page</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        font: 14px/1.5 -apple-system, sans-serif;
        background: light-dark(#f4f4f2, #1b1b1d);
        color: light-dark(#1d1d1f, #f2f2f3);
      }
      main {
        animation: rise 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
        max-width: 420px;
        padding: 24px;
        text-align: center;
      }
      h1 {
        font-size: 17px;
        font-weight: 600;
        margin: 0 0 6px;
      }
      p {
        margin: 0 0 4px;
        color: #8a8a8e;
        overflow-wrap: anywhere;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        main {
          animation: none;
        }
      }
      a {
        display: inline-block;
        margin-top: 14px;
        color: #0a84ff;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="heading">Can’t open this page</h1>
      <p id="url"></p>
      <p id="reason"></p>
      <a id="retry" href="#">Try again</a>
    </main>
    <script src="strings.js"></script>
    <script>
      const params = new URLSearchParams(location.search)
      const url = params.get('url') || ''
      document.getElementById('url').textContent = url
      document.getElementById('reason').textContent = params.get('reason') || ''
      if (/^https?:/.test(url)) document.getElementById('retry').href = url
      window.sadeLib?.call('lang').then((lang) => {
        const t = sadeStrings.translator(lang)
        document.documentElement.dir = sadeStrings.direction(lang)
        document.title = t('Can’t open page')
        document.getElementById('heading').textContent = t('Can’t open this page')
        document.getElementById('retry').textContent = t('Try again')
      })
    </script>
  </body>
</html>
