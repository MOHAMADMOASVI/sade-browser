<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data:; style-src 'self'" />
    <title>New Tab</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="dashboard.css" />
  </head>
  <body>
    <main>
      <header>
        <p id="date"><span id="weekday"></span><span id="day"></span></p>
        <p id="other-dates"></p>
      </header>

      <div id="strip">
        <span id="weather"></span>
        <span id="occasion"></span>
      </div>

      <div id="search">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.4" /><path d="m10.4 10.4 3.2 3.2" /></svg>
        <input id="q" spellcheck="false" autocomplete="off" />
        <div id="suggestions" hidden></div>
      </div>

      <div id="sites">
        <section id="recent-section">
          <h2 id="recent-title"></h2>
          <div class="icons" id="recent"></div>
        </section>
        <section id="top-section">
          <h2 id="top-title"></h2>
          <div class="icons" id="top"></div>
        </section>
      </div>
    </main>
    <script src="strings.js"></script>
    <script src="occasions.js"></script>
    <script src="dashboard.js"></script>
  </body>
</html>
